[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "vrptw-fleetmin"
version = "0.1.0"
description = "Fast VRPTW constructive heuristics and an ILS-based fleet-size minimizer (PyVRP 0.12.2 HGS local-search backend)."
readme = "README.md"
authors = [
    { name = "Florian Rascoussier", email = "rascoussier.florian@gmail.com" },
]
maintainers = [
    { name = "Florian Rascoussier", email = "rascoussier.florian@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyvrp>=0.12.2,<0.13", # last 0.12.x; 0.13+ dropped HGS solver (switch to ILS) and renamed private APIs we depend on
    "mamut-routing-lib>=0.1",
]
keywords = [
    "vehicle routing problem",
    "VRP",
    "VRPTW",
    "time windows",
    "iterated local search",
    "ILS",
    "constructive heuristics",
    "nearest neighbor",
    "cheapest insertion",
    "regret insertion",
    "operations research",
    "combinatorial optimization",
    "fleet size minimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/0nyr/vrptw-fleetmin"
Repository = "https://github.com/0nyr/vrptw-fleetmin"
Issues = "https://github.com/0nyr/vrptw-fleetmin/issues"
"Related: MAMUT-routing" = "https://github.com/0nyr/MAMUT-routing"
"Related: mamut-routing-lib" = "https://pypi.org/project/mamut-routing-lib/"
"Related: vrptw-fleet-lb-cg" = "https://github.com/0nyr/vrptw-fleet-lb-cg"

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/vrptw_fleetmin"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "slow: end-to-end tests that solve real instances with a non-trivial time budget",
]

# cibuildwheel is invoked LOCALLY (via Docker on the dev host) rather than
# from a GitHub Action while the package remains in early alpha. The CLI
# orchestrates a manylinux2014 Docker build so the resulting wheels carry the
# manylinux_2_17 / manylinux2014 tag and are portable across virtually every
# Linux x86_64 distro (glibc 2.17 and newer: RHEL 7+, Ubuntu 14.04+, etc.),
# without paying the maintenance cost of a CI workflow.
#
# macOS, Windows, Linux aarch64, and musllinux (Alpine) are deliberately out
# of scope for v0.1.0 — users on those platforms install from sdist and pip
# builds the C++ extension locally (CMake >= 3.20, C++17 compiler required).
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
archs = ["x86_64"]
build-verbosity = 1
